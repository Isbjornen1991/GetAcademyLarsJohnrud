<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>

    <style>
      .colorDiv {
        border: 4px;
        border-style: solid;

        width: 50px;
        height: 50px;
        margin: 5px;
      }

      #container, #gradient-container {
        display: grid;
        /* Automatically fill rows based on available screen space */
        grid-template-columns: repeat(auto-fill, minmax(60px, 1fr));
        gap: 5px;
        padding: 10px 0;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>

    <script>
      // --- Model ---
      const app = document.getElementById("app");
      let currentColor = { red: 100, green: 100, blue: 100 };
      let selectedIndex = null;

      let colorList = [
        { red: 255, green: 0, blue: 0 },
        { red: 0, green: 255, blue: 0 },
        { red: 0, green: 0, blue: 255 },
        { red: 0, green: 0, blue: 0 },
        { red: 255, green: 255, blue: 255 },
      ];

      let gradientList = [];

      // --- View ---
      function createDivHtml(colorObject, index) {
        let isSelected = index === selectedIndex;
        let borderStyle = isSelected ? "4px solid gold" : "4px solid black";

        return `
          <div 
            class="colorDiv" 
            onclick="handleSquareClick(${index})" 
            style="background-color: rgb(${colorObject.red}, ${colorObject.green}, ${colorObject.blue}); border: ${borderStyle};">
          </div>
        `;
      }

      function createGradientDivHtml(gradientCss) {
        return `
          <div 
            class="colorDiv" 
            style="background: ${gradientCss}; width: 50px; height: 50px;">
          </div>
        `;
      }

      function updateView() {
        let divsHtml = colorList
          .map((color, index) => createDivHtml(color, index))
          .join("");

        let gradientsHtml = gradientList
          .map((g) => createGradientDivHtml(g))
          .join("");

        app.innerHTML = /*HTML*/ `
          <div>
            <button onclick="addRandomDiv()">Add Random Color</button>
            <button onclick="handleCreateGradientClick()">Create Gradient</button>
          </div>
          <hr />
          <h3>Solid Colors</h3>
          <div id="container">
            ${divsHtml}
          </div>
          <hr />
          <h3>Gradients</h3>
          <div id="gradient-container">
            ${gradientsHtml}
          </div>
        `;
      }

      // --- Controller ---
      function addDiv(colorObject) {
        colorList.push(colorObject);
        updateView();
      }

      function addRandomDiv() {
        let randomColor = {
          red: Math.floor(Math.random() * 256),
          green: Math.floor(Math.random() * 256),
          blue: Math.floor(Math.random() * 256),
        };
        addDiv(randomColor);
      }

      function populateGrid() {
        for (let i = 0; i < 82; i++) {
          addRandomDiv();
        }
      }

      // Takes an object, returns a NEW inverted object
      function invertColor(colorObject) {
        return {
          red: 255 - colorObject.red,
          green: 255 - colorObject.green,
          blue: 255 - colorObject.blue,
        };
      }

      function blendTwoColors(c1, c2) {
        return {
          red: Math.round((c1.red + c2.red) / 2),
          green: Math.round((c1.green + c2.green) / 2),
          blue: Math.round((c1.blue + c2.blue) / 2),
        };
      }

      function handleSquareClick(index) {
        // First click: select the square
        if (selectedIndex === null) {
          selectedIndex = index;
          updateView();
          return;
        }

        // Second click on the SAME square: invert it
        if (selectedIndex === index) {
          colorList[index] = invertColor(colorList[index]);
          selectedIndex = null; // reset selection
          updateView();
          return;
        }

        // Second click on a DIFFERENT square: blend them
        let color1 = colorList[selectedIndex];
        let color2 = colorList[index];

        let blendedColor = blendTwoColors(color1, color2);
        colorList.push(blendedColor);
        selectedIndex = null; // reset selection

        updateView();
      }

      function createGradient(inputColor) {
        let color1 = inputColor;
        let color5 = invertColor(color1);
        let color3 = blendTwoColors(color1, color5);
        let color2 = blendTwoColors(color1, color3);
        let color4 = blendTwoColors(color3, color5);

        return [color1, color2, color3, color4, color5];
      }

      function formatGradientCss(colorArray) {
        let rgbStrings = colorArray.map(
          (c) => `rgb(${c.red}, ${c.green}, ${c.blue})`,
        );
        return `radial-gradient(circle, ${rgbStrings.join(", ")})`;
      }

      // Restored missing function!
      function handleCreateGradientClick() {
        if (selectedIndex === null) {
          alert("Please click a color square first to select it!");
          return;
        }

        let baseColor = colorList[selectedIndex];
        let gradientColors = createGradient(baseColor);
        let cssString = formatGradientCss(gradientColors);

        gradientList.push(cssString);
        selectedIndex = null;

        updateView();
      }

      // --- Init page ---
      populateGrid();
    </script>
  </body>
</html>
