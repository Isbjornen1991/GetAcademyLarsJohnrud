<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      body {
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        background: radial-gradient(hsla(60, 2%, 33%, 0.411), #333333);
        font-size: 24px;
        font-weight: bold;
        font-family: sans-serif;
      }

      .textarea {
        background-color: rgb(74, 123, 167);
        border: 2px solid #42414133;
        border-radius: 4px;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>

    <script>
      // Model
      const app = document.getElementById("app");
      let inputText = "";
      let words = [];
      let wordCounts = [];
      const loremText =
        "Lorem ipsum dolor sit amet, consectetur adipiscing elit, sed do eiusmod tempor incididunt ut labore et dolore magna aliqua. Ut enim ad minim veniam, quis nostrud exercitation ullamco laboris nisi ut aliquip ex ea commodo consequat. Duis aute irure dolor in reprehenderit in voluptate velit esse cillum dolore eu fugiat nulla pariatur. Excepteur sint occaecat cupidatat non proident, sunt in culpa qui officia deserunt mollit anim id est laborum.";

      // View
      function updateView() {
        app.innerHTML = /*HTML*/ `
          <input
            type="text"
            value="${inputText}"
            placeholder="Paste your text here..."
            oninput="inputText = this.value"
          >
      
          <button onclick="textCleaner(inputText)">Press me to operate</button>
          <button onclick="fillLoremText()">Fill Lorem Ipsum</button>

            <div class="textarea" id="textArea">
                <div id="wordArea"></div>
                <div id="countArea"></div>
            </div>
        `;
      }
      updateView();

      // Controller
      function textCleaner(input) {
        let clean = getCleanedText(input);
        words = clean.split(" ");

        wordCounting(words);

        populateTextArea();
      }

      //   function textCleaner(input) {
      //     let clean = getCleanedText(input);
      //     words = clean.split(" ");

      //     wordCounting(cleanArray);

      //     populateTextArea();
      //   }

      function getCleanedText(rawText) {
        const allowedChars =
          "abcdefghijklmnopqrstuvwxyzæøåABCDEFGHIJKLMNOPQRSTUVWXYZÆØÅ ";
        let cleanText = "";

        for (let i = 0; i < rawText.length; i++) {
          let char = rawText[i];
          if (allowedChars.includes(char)) {
            cleanText += char;
          }
        }

        return cleanText;
      }

      function wordCounting(cleanArray) {
        words = [];
        wordCounts = [];

        for (let i = 0; i < cleanArray.length; i++) {
          let currentWord = cleanArray[i];

          let index = words.indexOf(currentWord);

          // So first off, this is some archaeic JS stuff:
          // index !== -1 translated into semi-human speak "Is the index NOT equal to -1?"
          // If it is NOT -1, it means that the word has already been found at a position inside of the array.
          // THUS MEANING we can then increase that index value by 1
          if (index !== -1) {
            wordCounts[index]++;
            // However, in the case that it does NOT exist, ie it IS -1,
            // we then push that current word into words[], which we just
            // cleaned at the beginning of this function.
            // We then tell WordCounts[] to push a value of 1
            // Since we cleaned both arrays, the position of the value and the word will be matching
          } else {
            words.push(currentWord);
            wordCounts.push(1);
          }
        }
      }

      function populateTextArea() {
        let html = "";

        for (let i = 0; i < words.length; i++) {
          html += `<div>${words[i]} = ${wordCounts[i]}</div>`;
        }

        document.getElementById("textArea").innerHTML = html;
      }

      function fillLoremText() {
        inputText = loremText;
        updateView();
      }
    </script>
  </body>
</html>
