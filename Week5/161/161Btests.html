<!doctype html>
<html>
  <meta charset="utf-8" />
  <title>QUnit</title>
  <link
    rel="stylesheet"
    href="https://code.jquery.com/qunit/qunit-2.26.0.css"
  />
  <body>
    <div id="qunit"></div>
    <div id="qunit-fixture"></div>
    <script src="https://code.jquery.com/qunit/qunit-2.26.0.js"></script>
    <script src="161Bscripts.js"></script>
    <div id="output"></div>
    <script>
      QUnit.test(
        "testEmail should return true when text contains @",
        function (assert) {
          assert.equal(
            betterTestEmail("ola@example.com"),
            true,
            "Should return true for valid email format",
          );
          assert.equal(
            betterTestEmail("user@domain"),
            true,
            "Should return true whenever @ is present",
          );
        },
      );

      QUnit.test(
        "testEmail should return false when text lacks @",
        function (assert) {
          assert.equal(
            betterTestEmail("notanemail.com"),
            false,
            "Should return false when @ is missing",
          );
          assert.equal(
            betterTestEmail("hello world"),
            false,
            "Should return false for plain text without @",
          );
        },
      );

      QUnit.test(
        "checkForPeriod should return true when periods are present before and after @",
        function (assert) {
          assert.equal(checkForPeriod("lars.johnsrud@hotmail.com"), true);
        },
      );

      QUnit.test(
        "checkForPeriod should return false when text lacks periods before and after @",
        function (assert) {
          assert.equal(
            checkForPeriod("doesnotcontainperiod@hotmailcom"),
            false,
          );
          assert.equal(checkForPeriod("onlyhasperiodhere.@hotmailcom"), false);
          assert.equal(checkForPeriod("onlyperiodafter@hotmail.com"), false);
        },
      );
    </script>
  </body>
</html>
